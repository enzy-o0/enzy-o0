name: Waka Readme

on:
  schedule:
    # 매일 18:30 UTC (= 03:30 KST)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with dev metrics
    runs-on: ubuntu-latest
    # 준비가 끝나기 전까지는 조용히 스킵합니다 (빨간 X 실패 알림 방지).
    # WakaTime 가입 + 시크릿 등록을 마친 뒤,
    # Settings > Secrets and variables > Actions > Variables 에서
    # WAKA_ENABLED = true 를 추가하면 그날부터 자동으로 돌기 시작합니다.
    # (job-level if 에서는 secrets 컨텍스트를 쓸 수 없어 vars 로 게이팅합니다)
    if: ${{ vars.WAKA_ENABLED == 'true' }}
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # --- 표시할 항목 ---
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_COMMIT: "True"        # 시간대별 커밋 분포
          SHOW_DAYS_OF_WEEK: "True"  # 요일별 커밋 분포
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"       # Claude Code 사용 시간이 여기 잡힙니다
          SHOW_OS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_UPDATED_DATE: "True"

          # --- AI 코딩 지표 (이 README 컨셉의 핵심) ---
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "True"

          # --- 숨길 항목 ---
          SHOW_PROFILE_VIEWS: "False"  # 상단 komarev 뱃지와 중복
          SHOW_PROJECTS: "False"       # 사내/비공개 프로젝트명 노출 방지

          # --- 스타일 ---
          BAR_STYLE: "text"        # 유니코드 텍스트 막대 (이미지 의존 없음 = 안 깨짐)
          BADGE_STYLE: "flat-square"
          LOCALE: "ko"
