name: Waka Readme

on:
  schedule:
    # 매일 18:30 UTC (= 03:30 KST)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with dev metrics
    runs-on: ubuntu-latest
    # Settings > Secrets and variables > Actions > Variables 에서
    # WAKA_ENABLED = true 일 때만 실행됩니다.
    # (job-level if 에서는 secrets 컨텍스트를 쓸 수 없어 vars 로 게이팅합니다)
    if: ${{ vars.WAKA_ENABLED == 'true' }}
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # ─────────────────────────────────────────────────────────────
          # AI 코딩 지표만 남깁니다.
          #
          # 나머지를 모두 끈 이유:
          #   - 시간대별 커밋은 pin 된 productive-box gist 와 지표가 겹치는데,
          #     두 도구의 집계 범위가 달라(productive-box 는 history(first:100))
          #     같은 항목이 서로 다른 숫자로 표시됐습니다.
          #   - SHOW_SHORT_INFO 블록은 hireable 값("구직중이지 않아요")과
          #     비공개 저장소 개수를 노출합니다.
          #   - SHOW_LOC_CHART 는 assets/bar_graph.png 를 저장소에 커밋합니다.
          # ─────────────────────────────────────────────────────────────

          # --- 유지 ---
          SHOW_AI_CODE_TIME: "True"   # 누적 AI 코딩 시간 뱃지
          SHOW_AI_CODING: "True"      # 주간 AI 코딩 상세 블록

          # --- 끔 (기본값이 True 라 명시적으로 꺼야 합니다) ---
          SHOW_LOC_CHART: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_UPDATED_DATE: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_OS: "False"
          SHOW_EDITORS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LANGUAGE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "False"

          # --- 스타일 ---
          BAR_STYLE: "text"
          BADGE_STYLE: "flat-square"
          LOCALE: "ko"
