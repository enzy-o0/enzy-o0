name: Waka Probe

# 임시 진단용. WakaTime 응답에 실제로 어떤 필드가 오는지 확인한 뒤 삭제합니다.
# 값은 찍지 않고 키 이름과 항목 개수만 출력합니다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump available fields
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          # 비공개 프로젝트명 등이 로그에 남지 않도록 이름을 노출하지 않는 목록.
          REDACT = {"projects", "machines", "dependencies", "branches", "entities"}

          for period in ("last_7_days", "all_time"):
              url = f"https://wakatime.com/api/v1/users/current/stats/{period}?api_key={os.environ['WAKATIME_API_KEY']}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response).get("data", {})
              except Exception as error:
                  print(f"\n=== {period}: 요청 실패 {error}")
                  continue

              print(f"\n=== {period} ===")
              for key, value in sorted(data.items()):
                  if isinstance(value, list):
                      names = "-" if key in REDACT else ", ".join(str(i.get("name", "?")) for i in value[:8] if isinstance(i, dict))
                      print(f"  {key:38} list[{len(value)}]  {names}")
                  elif isinstance(value, dict):
                      print(f"  {key:38} dict  keys={sorted(value.keys())}")
                  else:
                      print(f"  {key:38} {type(value).__name__} = {value}")
          PY
